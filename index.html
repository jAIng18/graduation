     (không lấy từ config.js được, vì các app đó không chạy JavaScript khi đọc link). -->

<meta property="og:title" content="Thư mời dự lễ tốt nghiệp — Trần Trường Giang">
<meta property="og:description" content="Chủ Nhật 06.12.2026 · 16:00 – 17:30 · ĐH Khoa học Tự nhiên TP.HCM">
<meta property="og:image" content="https://jaing18.github.io/graduation/og.jpg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    /* HCMUS blue. Đổi các dòng --brand là đổi tông màu cả trang. */
    --brand: #1f4e9e;
    --brand-deep: #0f2d63;
    --brand-light: #4a7fd0;
    --brand-50: #eef3fb;
    --brand-100: #dbe6f6;
    --gold: #f0b429;          /* điểm nhấn nhỏ: tua mũ, chấm đếm ngược */
    --ink: #0f1b2d;
    --muted: #5d6b80;
    --line: #e3e9f2;
    --bg: #f5f7fb;
    --card: #ffffff;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(15, 27, 45, .04), 0 10px 30px -14px rgba(15, 27, 45, .16);
    --sans: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { overscroll-behavior: none; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.65; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ========== Intro: an invitation envelope opens ========== */
  #show {
    position: fixed; inset: 0; z-index: 10; display: none; place-items: center; text-align: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #ffffff 0%, var(--bg) 70%);
    transition: opacity .7s;
  }
  #show.on { display: grid; }
  #show.gone { opacity: 0; pointer-events: none; }
  /* The envelope: back, letter, front pocket, flap and seal stacked on top of each other. */
  .env { --w: min(84vw, 380px); position: relative; width: var(--w); aspect-ratio: 3 / 2; margin-top: calc(var(--w) * .42); perspective: 900px; opacity: 0; }
  .env.in { animation: drop .9s cubic-bezier(.2, .9, .3, 1.25) forwards; }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotate(-4deg) scale(.9); } to { opacity: 1; transform: none; } }
  .env > * { position: absolute; transition: translate .7s cubic-bezier(.5, 0, .75, 0), opacity .6s, scale .8s cubic-bezier(.3, 0, .2, 1); }
  .env-back { inset: 0; border-radius: 10px; background: #12346e; box-shadow: 0 24px 50px -20px rgba(15, 45, 99, .55); }
  .letter {
    left: 6%; right: 6%; top: 6%; height: 90%; z-index: 2; border-radius: 8px; background: #fff;
    box-shadow: 0 6px 18px -8px rgba(15, 45, 99, .35); padding: 7% 6% 0; display: flex; flex-direction: column; align-items: center;
    transition: transform 1.1s cubic-bezier(.3, 1.2, .4, 1), translate .7s, opacity .6s, scale .8s cubic-bezier(.3, 0, .2, 1);
  }
  .letter::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gold); border-radius: 5px; opacity: .7; }
  .env.rise .letter { transform: translateY(-62%); }
  .letter .pre { font-size: 11px; font-weight: 600; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
  .letter .headline { font-weight: 700; font-size: clamp(26px, 8vw, 34px); line-height: 1.15; margin-top: 4px; color: var(--brand-deep); letter-spacing: -.02em; }
  .letter .to { margin-top: 8px; font-size: 14px; font-weight: 500; color: var(--brand); }
  .letter .to:empty { display: none; }
  .env-front {
    inset: 0; z-index: 3; border-radius: 10px;
    background: linear-gradient(160deg, var(--brand-light), var(--brand) 55%, var(--brand-deep));
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    left: 0; right: 0; top: 0; height: 60%; z-index: 4; transform-origin: 50% 0;
    background: linear-gradient(180deg, #2a5fb8, var(--brand)); clip-path: polygon(0 0, 100% 0, 50% 100%);
    transition: transform .7s cubic-bezier(.5, 0, .3, 1), z-index 0s .35s, translate .7s cubic-bezier(.5, 0, .75, 0), opacity .6s;
  }
  .env.open .env-flap { transform: rotateX(180deg); z-index: 1; }
  .seal {
    left: 50%; top: 60%; z-index: 5; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #7a5200;
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 55%, #c48a00);
    box-shadow: 0 4px 10px rgba(122, 82, 0, .35), inset 0 0 0 3px rgba(255, 255, 255, .25);
    animation: throb 1s ease-in-out .9s 1;
  }
  @keyframes throb { 50% { transform: scale(1.12); } }
  .env.open .seal { transform: scale(1.6); opacity: 0; transition: transform .35s, opacity .35s; }
  /* leaving: the envelope drops away, the letter grows and fades into the invitation */
  .env.leave > :not(.letter) { translate: 0 70vh; opacity: 0; }
  .env.leave .letter { scale: 1.25; opacity: 0; }
  #skip {
    position: fixed; right: 20px; bottom: 20px; font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
    background: rgba(255, 255, 255, .8); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  #skip:hover { color: var(--brand); border-color: var(--brand-100); }
  #sparks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* ========== The invitation ========== */
  #final { display: none; opacity: 0; transition: opacity .8s; font-variant-numeric: lining-nums tabular-nums; }
  #final.on { display: block; }
  #final.visible { opacity: 1; }
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s, transform .7s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i, 0) * 90ms); }
  #final.visible .reveal { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { transition: none; opacity: 1; transform: none; } }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(245, 247, 251, .85); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid transparent; }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .topbar .container { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--brand-deep); }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; }
  .brand .mark svg { width: 17px; height: 17px; }
  #lang { font: inherit; font-size: 12px; font-weight: 600; display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  #lang b, #lang span { padding: 3px 10px; border-radius: 999px; }
  #lang b { background: var(--brand); color: #fff; }
  #lang span { color: var(--muted); }

  .hero { display: grid; grid-template-columns: 7fr 5fr; gap: 48px; align-items: center; padding: 48px 0 40px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--brand); background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: 999px; padding: 5px 12px 5px 10px; }
  .chip .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(240, 180, 41, .6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(240, 180, 41, 0); } 100% { box-shadow: 0 0 0 0 rgba(240, 180, 41, 0); } }
  .eyebrow { margin-top: 22px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .heading { font-weight: 700; font-size: clamp(34px, 5.4vw, 54px); line-height: 1.1; letter-spacing: -.025em; margin: 8px 0 24px; color: var(--brand-deep); }
  .heading em { font-style: normal; background: linear-gradient(90deg, var(--brand), var(--brand-light)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; position: relative; }
  .note::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
  .dear { font-weight: 600; font-size: 17px; margin: 0 0 6px; }
  .msg { margin: 0; color: #2c3a50; font-size: 16px; white-space: pre-line; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
         border-radius: 12px; padding: 11px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: transform .15s, box-shadow .15s, background .15s, border-color .15s; }
  .btn:hover { transform: translateY(-1px); border-color: var(--brand-100); box-shadow: var(--shadow); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 8px 20px -10px rgba(31, 78, 158, .7); }
  .btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }

  .portrait { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 12px; }
  .portrait img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; border-radius: 16px; background: var(--brand-50); }
  @media (min-width: 861px) { .portrait img { max-height: calc(100vh - 260px); } }
  .portrait figcaption { padding: 14px 8px 6px; }
  .portrait .who { font-weight: 700; font-size: 20px; letter-spacing: -.01em; color: var(--brand-deep); }
  .portrait .faculty { font-size: 14px; color: var(--ink); margin-top: 2px; }
  .portrait .school { font-size: 13px; color: var(--muted); }

  .section-title { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 14px; margin: 0 0 18px; }
  .fact { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .fact .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-50); color: var(--brand); display: grid; place-items: center; flex: none; }
  .fact .ico svg { width: 20px; height: 20px; }
  .fact dt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .fact dd { margin: 2px 0 0; font-weight: 600; font-size: 17px; line-height: 1.4; }
  .fact dd small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 18px; }
  .route { display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; align-items: start; }
  .route.no-map { grid-template-columns: 1fr; }
  .gates { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
  .gates:empty { display: none; }
  .gates li { display: flex; align-items: center; gap: 12px; }
  .gates b { font-size: 13px; font-weight: 600; color: var(--brand); background: var(--brand-50); border-radius: 8px; padding: 3px 10px; white-space: nowrap; }
  .tip { display: flex; gap: 10px; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: #fff8e6; color: #6b4e00; font-size: 14px; }
  .tip svg { color: #c48a00; margin-top: 2px; }
  .map { position: relative; display: block; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .map img { display: block; width: 100%; }
  /* Meeting point: a gold ring with a ping, the rest of the map dimmed, the label bobbing above. */
  .spot { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
    border: 3px solid var(--gold); box-shadow: 0 0 0 9999px rgba(15, 45, 99, .28), 0 0 18px 2px rgba(240, 180, 41, .75), inset 0 0 14px rgba(240, 180, 41, .55); }
  .spot::before, .spot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--gold); animation: ping 2.2s cubic-bezier(0, 0, .2, 1) infinite; }
  .spot::after { animation-delay: 1.1s; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
  .spot .pin { left: 50%; top: -6px; }
  .pin {
    position: absolute; transform: translate(-50%, -100%);
    background: var(--brand); color: #fff; font-weight: 600; font-size: 11px; letter-spacing: .03em; padding: 3px 9px; border-radius: 6px;
    white-space: nowrap; animation: bob 1.4s ease-in-out infinite; box-shadow: 0 6px 14px -6px rgba(15, 45, 99, .6);
  }
  .pin::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--brand); }
  @keyframes bob { 50% { margin-top: -5px; } }
  @media (prefers-reduced-motion: reduce) { .spot::before, .spot::after, .pin { animation: none; } .spot::before, .spot::after { display: none; } }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .contact { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .contact p { margin: 0; color: var(--muted); }
  .contact-btns { display: flex; flex-wrap: wrap; gap: 10px; }
  .sign { text-align: center; padding: 28px 0 56px; font-weight: 500; color: var(--muted); }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 28px; padding: 28px 0 32px; }
    .portrait { order: -1; max-width: 360px; width: 100%; margin: 0 auto; }
    .facts { grid-template-columns: 1fr 1fr; }
    .facts .wide { grid-column: 1 / -1; }
    .route { grid-template-columns: 1fr; }
  }
  @media (max-width: 460px) {
    .facts { grid-template-columns: 1fr; }
    .actions .btn { flex: 1 1 100%; justify-content: center; }
    .panel { padding: 20px; }
  }
</style>
</head>
<body>

<!-- Intro: an invitation envelope drops in, the seal breaks, the letter slides out -->
<div id="show" aria-hidden="true">
  <div class="env" id="env">
    <div class="env-back"></div>
    <div class="letter">
      <div class="pre" data-t="showPre"></div>
      <div class="headline" data-t="showTitle"></div>
      <div class="to" id="letterTo"></div>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal" id="seal"></div>
  </div>
  <button id="skip" data-t="skip"></button>
</div>

<!-- The invitation -->
<main id="final">
  <nav class="topbar">
    <div class="container">
      <div class="brand">
        <span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v5"/></svg></span>
        <span data-t="brand"></span>
      </div>
      <button id="lang" aria-label="Language"></button>
    </div>
  </nav>

  <div class="container">
    <section class="hero">
      <div>
        <div class="chip reveal" style="--i:0"><span class="pulse"></span><span id="countdown"></span></div>
        <div class="eyebrow reveal" style="--i:1" data-t="eyebrow"></div>
        <h1 class="heading reveal" style="--i:2" data-t="title" data-html></h1>
        <div class="note reveal" style="--i:3">
          <p class="dear" id="dear"></p>
          <p class="msg" id="msg"></p>
        </div>
        <div class="actions reveal" style="--i:4">
          <a class="btn primary" id="gcal" target="_blank" rel="noopener">
            <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg><span data-t="gcal"></span>
          </a>
          <a class="btn" href="#" id="ics">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="ics"></span>
          </a>
          <a class="btn" id="gmapsHero" target="_blank" rel="noopener">
            <svg class="i" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg><span data-t="gmaps"></span>
          </a>
        </div>
      </div>
      <figure class="portrait reveal" style="--i:1">
        <img src="photo.jpg" alt="">
        <figcaption>
          <div class="who" id="who"></div>
          <div class="faculty" data-t="faculty"></div>
          <div class="school" data-t="school"></div>
        </figcaption>
      </figure>
    </section>

    <h2 class="section-title reveal" style="--i:5" data-t="whenWhere"></h2>
    <dl class="facts reveal" style="--i:6">
      <div class="fact">
        <span class="ico"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <div><dt data-t="dateL"></dt><dd data-t="date"></dd></div>
      </div>
      <div class="fact">
        <span class="ico"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <div><dt data-t="timeL"></dt><dd><span id="time"></span><small data-t="timeNote"></small></dd></div>
      </div>
      <div class="fact wide">
        <span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
        <div><dt data-t="placeL"></dt><dd data-t="place" data-html></dd></div>
      </div>
    </dl>

    <section class="panel route reveal" style="--i:7" id="route">
      <div>
        <h2 class="section-title" data-t="routeL"></h2>
        <ul class="gates" id="gates"></ul>
        <p class="tip"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg><span data-t="tip"></span></p>
        <a class="btn" id="gmaps" target="_blank" rel="noopener">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg><span data-t="gmaps"></span>
        </a>
      </div>
      <div id="mapBox">
        <a class="map" id="mapLink" target="_blank"><img id="mapImg" alt="campus map"><span class="spot" id="spot"><span class="pin" data-t="pin"></span></span></a>
        <div class="hint" data-t="zoom"></div>
      </div>
    </section>

    <section class="panel contact reveal" style="--i:8" id="contactBox">
      <div>
        <h2 class="section-title" style="margin-bottom:4px" data-t="contactL"></h2>
        <p data-t="contactNote"></p>
      </div>
      <div class="contact-btns">
        <a class="btn" id="zalo" target="_blank" rel="noopener">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.4-.6L4 20.5l1.3-3.9A7.9 7.9 0 0 1 3 11.5 8.6 8.6 0 0 1 12 3a8.6 8.6 0 0 1 9 8.5z"/></svg><span id="zaloText">Zalo</span>
        </a>
        <a class="btn" id="fb" target="_blank" rel="noopener">
          <svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 0-10.4 8.9v-6.3H8.3V12h2.3v-2c0-2.3 1.4-3.5 3.4-3.5 1 0 2 .2 2 .2v2.2h-1.1c-1.1 0-1.5.7-1.5 1.4V12h2.6l-.4 2.6h-2.2v6.3A9 9 0 0 0 21 12z"/></svg><span>Facebook</span>
        </a>
      </div>
    </section>

    <footer class="sign reveal" style="--i:9" data-t="sign"></footer>
  </div>
</main>

<canvas id="sparks"></canvas>

<script src="config.js"></script>
<script src="invite-crypto.js"></script>
<script>
// Your details live in config.js (ME, FULL_NAME, EVENT_DATE, GREETINGS, TEXT...). This block only adds
// the labels that are the same for everyone, and works out the date strings from EVENT_DATE.
const MAPS = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(MAPS_QUERY);

// "2026-11-28" + "15:30" (Vietnam time, UTC+7) -> "20261128T083000Z" for the calendar files
const [EY, EM, ED] = EVENT_DATE.split("-").map(Number);
const toUtc = hm => {
  const [h, m] = hm.split(":").map(Number);
  return new Date(Date.UTC(EY, EM - 1, ED, h - 7, m)).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
};
const DAY = new Date(Date.UTC(EY, EM - 1, ED));
const VI_WEEKDAYS = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
const pad = v => String(v).padStart(2, "0");
const TIME = `${EVENT_START} – ${EVENT_END}`;

// Days from today (in Vietnam) to the event: 0 = today, negative = already happened
function daysLeft() {
  const [y, m, d] = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Ho_Chi_Minh" }).split("-").map(Number);
  return Math.round((DAY - Date.UTC(y, m - 1, d)) / 86400000);
}

Object.assign(TEXT.vi, {
  lang: `<b>VI</b><span>EN</span>`,
  skip: "Bỏ qua →",
  showTo: "Gửi {n}",
  brand: `Lễ tốt nghiệp · ${SCHOOL_SHORT}`,

  dateL: "Ngày", date: `${VI_WEEKDAYS[DAY.getUTCDay()]}, ${pad(ED)}.${pad(EM)}.${EY}`,
  timeL: "Giờ", placeL: "Địa điểm",
  gcal: "Thêm vào lịch", ics: "Lịch iPhone (.ics)",
  zoom: "Bấm vào bản đồ để phóng to",
  gmaps: "Chỉ đường",
  contactL: "Liên hệ",
  contactNote: "Cần hỏi gì thêm, nhắn mình nhé.",
  countdown: d => d > 1 ? `Còn ${d} ngày` : d === 1 ? "Ngày mai" : d === 0 ? "Hôm nay" : "Đã diễn ra",
});
Object.assign(TEXT.en, {
  lang: `<span>VI</span><b>EN</b>`,
  skip: "Skip →",
  showTo: "For {n}",
  brand: `Graduation · ${SCHOOL_SHORT}`,
  whenWhere: "When & where",
  dateL: "Date", date: DAY.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }),
  timeL: "Time", placeL: "Place",
  gcal: "Add to calendar", ics: "Apple Calendar (.ics)",
  zoom: "Tap the map to zoom",
  gmaps: "Directions",
  contactL: "Contact",
  contactNote: "Any questions? Just message me.",
  countdown: d => d > 1 ? `${d} days to go` : d === 1 ? "Tomorrow" : d === 0 ? "Today" : "Already happened",
});

// ===== Read the guest from the URL =====
const params = new URLSearchParams(location.search);
// Custom invites are made by make.html. Three kinds of links:
//   ?to=duc-k3x9pqab   short link: "duc" is a line in guests.txt, "k3x9pqab" decrypts it (see invite-crypto.js)
//   ?i=...             older long link: the invite packed into the URL (base64url JSON, not secret)
//   ?to=Minh&g=family  plain name + one of the GREETINGS groups
// An invite is { n: name, d: greeting line, m: message }. Anything broken falls back to the defaults.
const clean = obj => {
  const str = (v, max) => typeof v === "string" ? v.trim().slice(0, max) : "";
  return { n: str(obj?.n, 40), d: str(obj?.d, 120), m: str(obj?.m, 1500) };
};
function readPacked() {
  const raw = params.get("i");
  if (!raw) return {};
  try {
    const bin = atob(raw.replace(/-/g, "+").replace(/_/g, "/"));
    return clean(JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))));
  } catch { return {}; }
}
const shortLink = InviteCrypto.SHORT_LINK.exec(params.get("to") || "");
async function readShort() {
  try { return clean(await InviteCrypto.lookup(shortLink[1], shortLink[2])); }
  catch (err) { console.warn("invite not loaded:", err); return {}; }
}
const group = GREETINGS[params.get("g")] ? params.get("g") : "friend";
let custom = {}, rawName = "";
async function loadGuest() {
  custom = shortLink ? await readShort() : readPacked();
  const plainName = shortLink ? "" : params.get("to");
  rawName = (custom.n || plainName || "").trim().slice(0, 40);
}

// ===== Language =====
function getSavedLang() { try { return localStorage.getItem("lang"); } catch { return null; } }
function saveLang(l) { try { localStorage.setItem("lang", l); } catch {} }
let lang = ["vi", "en"].includes(params.get("lang")) ? params.get("lang") : (getSavedLang() || "vi");

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  // data-html marks the few strings that contain our own markup; everything else is plain text.
  document.querySelectorAll("#final [data-t]").forEach(el => {
    if (el.hasAttribute("data-html")) el.innerHTML = t[el.dataset.t];
    else el.textContent = t[el.dataset.t];
  });
  const g = GREETINGS[group][lang];
  const n = rawName || t.fallback;
  // textContent, never innerHTML: the text comes from the link, so it must not be able to inject HTML
  document.getElementById("dear").textContent = (custom.d || g.dear).replaceAll("{n}", n);
  document.getElementById("msg").textContent = (custom.m || g.msg).replaceAll("{n}", n);
  document.getElementById("lang").innerHTML = t.lang;
  document.getElementById("time").textContent = TIME;
  document.getElementById("countdown").textContent = `${t.date} · ${t.countdown(daysLeft())}`;
  document.getElementById("gates").replaceChildren(...t.gates.map(([gate, street]) => {
    const li = document.createElement("li"), b = document.createElement("b"), s = document.createElement("span");
    b.textContent = gate; s.textContent = street;
    li.append(b, s);
    return li;
  }));
}

// ===== Links =====
// Times come from config.js in Vietnam time and are turned into UTC by toUtc()
const EVENT = {
  title: `Tốt nghiệp của ${ME} 🎓`,
  start: toUtc(EVENT_START), end: toUtc(EVENT_END),

};
document.getElementById("gcal").href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({

});
document.getElementById("ics").onclick = e => {

    `DTSTART:${EVENT.start}`, `DTEND:${EVENT.end}`,

  ].join("\r\n");

  a.click();
};
document.getElementById("gmaps").href = document.getElementById("gmapsHero").href = MAPS;
document.getElementById("who").textContent = FULL_NAME;
// Zalo opens a chat from the phone number: zalo.me/<number>. The button shows the number too, for calling.
if (ZALO) {
  const digits = ZALO.replace(/\D/g, "");
  document.getElementById("zalo").href = "https://zalo.me/" + digits;
  document.getElementById("zaloText").textContent = "Zalo · " + digits.replace(/^(\d{4})(\d{3})(\d+)$/, "$1 $2 $3");
} else document.getElementById("zalo").remove();
if (FB) document.getElementById("fb").href = FB;
else document.getElementById("fb").remove();
if (!FB && !ZALO) document.getElementById("contactBox").remove();
if (MAP_IMAGE) {

  spot.style.left = PIN.left;
  spot.style.top = PIN.top;

} else {
  document.getElementById("mapBox").remove();
  document.getElementById("route").classList.add("no-map");
}
document.getElementById("lang").onclick = () => { lang = lang === "vi" ? "en" : "vi"; saveLang(lang); render(); };
const topbar = document.querySelector(".topbar");
addEventListener("scroll", () => topbar.classList.toggle("scrolled", scrollY > 4), { passive: true });

const sleep = ms => new Promise(r => setTimeout(r, ms));
let stage = 1; // 1 = loading the guest, 2 = envelope intro, 3 = invitation

// ===== Particle canvas (sparkles + confetti), no library =====
const fx = (() => {
  const c = document.getElementById("sparks"), ctx = c.getContext("2d");
  let bits = [], running = false;
  function size() { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener("resize", size); size();
  function add(list) { bits.push(...list); if (!running) { running = true; requestAnimationFrame(frame); } }
  function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits = bits.filter(b => b.life > 0);
    for (const b of bits) b.step(ctx, now);
    ctx.globalAlpha = 1;
    if (bits.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  return { add };
})();

function sparkBurst(x, y, n) {
  const colors = ["#1f4e9e", "#4a7fd0", "#f0b429", "#9cc0f0"];
  fx.add(Array.from({ length: n }, (_, i) => {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 4;
    const b = { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, r: .6 + Math.random() * 1.8,
                life: 1, decay: .007 + Math.random() * .012, tw: Math.random() * 6, color: colors[i % colors.length] };
    b.step = ctx => {
      b.x += b.vx; b.y += b.vy; b.vx *= .985; b.vy = b.vy * .985 + .03; b.life -= b.decay; b.tw += .25;
      ctx.globalAlpha = Math.max(0, b.life) * (.6 + .4 * Math.sin(b.tw));
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    };
    return b;
  }));
}

// Paper confetti: little rectangles that flutter (squash on one axis) while they fall.
function confetti(x, y, n, dir) {
  const colors = ["#1f4e9e", "#4a7fd0", "#f0b429", "#9cc0f0", "#ffffff", "#ffd36b"];
  fx.add(Array.from({ length: n }, (_, i) => {
    const b = { x, y, vx: dir * (1.5 + Math.random() * 6), vy: -(7 + Math.random() * 7), w: 6 + Math.random() * 6, h: 3 + Math.random() * 3,
                rot: Math.random() * 6, vr: (Math.random() - .5) * .3, flip: Math.random() * 6, life: 1, color: colors[i % colors.length] };
    b.step = ctx => {
      b.vy += .22; b.vx *= .985; b.vy = Math.min(b.vy, 4.5);
      b.x += b.vx + Math.sin(b.flip) * .6; b.y += b.vy; b.rot += b.vr; b.flip += .12;
      if (b.y > innerHeight + 20) { b.life = 0; return; }
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.scale(1, Math.cos(b.flip));
      ctx.fillStyle = b.color; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    };
    return b;
  }));
}

// ===== Intro: envelope drops in, seal breaks, flap opens, letter slides out, confetti, then into the card =====
async function goStage2() {
  if (stage !== 1) return;
  stage = 2;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return goStage3();

  const show = document.getElementById("show");
  const env = document.getElementById("env");
  const t = TEXT[lang];
  document.querySelectorAll("#show [data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.getElementById("seal").textContent = ME.trim().charAt(0).toUpperCase();
  if (rawName) document.getElementById("letterTo").textContent = t.showTo.replace("{n}", rawName);
  document.getElementById("skip").onclick = () => goStage3();
  const step = async (ms, fn) => { await sleep(ms); if (stage !== 2) return false; fn(); return true; };

  show.classList.add("on");
  env.classList.add("in");
  if (!await step(1900, () => {                       // the seal throbs once, then breaks
    const r = document.getElementById("seal").getBoundingClientRect();
    sparkBurst(r.left + r.width / 2, r.top + r.height / 2, 60);
    env.classList.add("open");
  })) return;
  if (!await step(650, () => env.classList.add("rise"))) return;
  if (!await step(700, () => {
    confetti(0, innerHeight * .75, 70, 1);
    confetti(innerWidth, innerHeight * .75, 70, -1);
  })) return;
  if (!await step(1500, () => env.classList.add("leave"))) return;
  await sleep(450);
  goStage3();
}

// The invitation fades in under the intro, then the intro fades away on top of it.
async function goStage3() {
  if (stage === 3) return;
  stage = 3;
  const show = document.getElementById("show");
  render();
  const fin = document.getElementById("final");
  fin.classList.add("on");
  window.scrollTo(0, 0);
  void fin.offsetWidth; // forced reflow: the browser applies opacity 0 first, so the fade to 1 is animated
  fin.classList.add("visible");
  show.classList.add("gone");
  await sleep(700);
  show.remove();
}

loadGuest().then(goStage2);
